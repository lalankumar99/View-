<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud Code Studio | lalankumar99</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card: rgba(22, 27, 34, 0.9);
      --border: rgba(255, 255, 255, 0.1);
      --accent: #58a6ff;
      --green: #238636;
      --purple: #8957e5;
      --text: #e6edf3;
      --subtext: #8b949e;
      --console-bg: #05080e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top right, #1a2332, var(--bg));
      color: var(--text);
      min-height: 100vh;
      padding: 25px 15px;
    }

    .container {
      max-width: 950px;
      margin: 0 auto;
      background: var(--card);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.6);
      overflow: hidden;
    }

    .header {
      padding: 20px 24px;
      background: rgba(255,255,255,0.03);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .token-box {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .token-input {
      background: #0d1117;
      border: 1px solid var(--border);
      color: #79c0ff;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      outline: none;
      width: 180px;
    }

    ul { list-style: none; }
    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
    }
    li:hover { background: rgba(255, 255, 255, 0.03); }

    .file-meta { display: flex; align-items: center; gap: 12px; }
    .file-name { color: var(--text); font-weight: 500; font-size: 0.95rem; }
    .badge { font-size: 0.7rem; text-transform: uppercase; padding: 3px 8px; border-radius: 4px; background: #30363d; color: var(--subtext); }

    .actions { display: flex; gap: 8px; }
    .btn {
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      transition: 0.2s;
    }

    .btn-edit { background: var(--purple); color: #fff; }
    .btn-edit:hover { background: #9e6cf7; }
    .btn-run { background: var(--green); color: #fff; }
    .btn-run:hover { background: #2ea043; }
    .btn-save { background: #1f6feb; color: #fff; }
    .btn-save:hover { background: #388bfd; }
    .btn-close { background: #da3633; color: #fff; }

    /* Modal / Workspace */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(10px);
      z-index: 999;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-content {
      background: #161b22;
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 100%;
      max-width: 1100px;
      height: 90vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-bar {
      padding: 12px 20px;
      background: #0d1117;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      gap: 10px;
    }

    .workspace {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      flex: 1;
      height: 100%;
    }

    textarea {
      width: 100%;
      height: 100%;
      background: #0d1117;
      color: #79c0ff;
      border: none;
      padding: 16px;
      font-family: 'Fira Code', monospace;
      font-size: 0.9rem;
      resize: none;
      outline: none;
      line-height: 1.5;
      border-right: 1px solid var(--border);
    }

    .output-panel {
      display: flex;
      flex-direction: column;
      height: 100%;
      background: var(--console-bg);
    }

    iframe {
      width: 100%;
      flex: 1;
      border: none;
      background: #fff;
    }

    #console-out {
      flex: 1;
      padding: 16px;
      font-family: 'Fira Code', monospace;
      font-size: 0.85rem;
      color: #7ee787;
      overflow-y: auto;
      white-space: pre-wrap;
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h2>⚡ Cloud Repo Studio</h2>
      <div class="token-box">
        <input type="password" id="github-token" class="token-input" placeholder="GitHub Token (for save)" onchange="storeToken()">
        <span style="font-size:0.75rem; color:var(--subtext)">🔑 Optional</span>
      </div>
    </div>
    <div id="status" style="padding: 30px; text-align: center; color: var(--subtext);">Fetching files...</div>
    <ul id="file-list"></ul>
  </div>

  <!-- Studio Workspace Modal -->
  <div id="editor-modal" class="modal">
    <div class="modal-content">
      <div class="modal-bar">
        <span id="active-filename" style="font-weight:600; font-size:0.95rem;">file</span>
        <div style="display:flex; gap:8px;">
          <button class="btn btn-run" onclick="runFile()">▶ Run</button>
          <button class="btn btn-save" id="save-btn" onclick="saveToGitHub()">💾 Save to GitHub</button>
          <button class="btn btn-close" onclick="closeEditor()">✕ Close</button>
        </div>
      </div>
      <div class="workspace">
        <textarea id="editor-input" placeholder="Write or edit code here..."></textarea>
        <div class="output-panel">
          <iframe id="editor-preview"></iframe>
          <div id="console-out"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const user = "lalankumar99";
    const repo = "View-";
    let activeFile = null;

    // Load cached token if available
    document.getElementById("github-token").value = localStorage.getItem("gh_token") || "";

    function storeToken() {
      localStorage.setItem("gh_token", document.getElementById("github-token").value.trim());
    }

    // Load repository contents
    fetch(`https://api.github.com/repos/${user}/${repo}/contents/`)
      .then(res => res.json())
      .then(data => {
        document.getElementById("status").style.display = "none";
        const list = document.getElementById("file-list");

        if (!Array.isArray(data)) {
          list.innerHTML = `<li style="justify-content:center;">No files found.</li>`;
          return;
        }

        list.innerHTML = data.filter(i => i.type === "file").map(item => `
          <li>
            <div class="file-meta">
              <span>📁</span>
              <span class="file-name">${item.name}</span>
              <span class="badge">${item.name.split('.').pop()}</span>
            </div>
            <div class="actions">
              <button class="btn btn-edit" onclick='launchStudio(${JSON.stringify(item)})'> Open / Edit & Run</button>
            </div>
          </li>
        `).join('');
      })
      .catch(() => {
        document.getElementById("status").innerText = "Error loading repository.";
      });

    function launchStudio(file) {
      activeFile = file;
      document.getElementById("active-filename").innerText = file.name;
      document.getElementById("editor-input").value = "Loading code...";
      document.getElementById("editor-modal").style.display = "flex";

      fetch(file.download_url)
        .then(res => res.text())
        .then(content => {
          document.getElementById("editor-input").value = content;
          runFile();
        });
    }

    // Execution engine for any file type
    function runFile() {
      const code = document.getElementById("editor-input").value;
      const ext = activeFile.name.split('.').pop().toLowerCase();
      const preview = document.getElementById("editor-preview");
      const consoleBox = document.getElementById("console-out");

      if (['html', 'htm'].includes(ext)) {
        preview.style.display = "block";
        consoleBox.style.display = "none";
        const doc = preview.contentDocument || preview.contentWindow.document;
        doc.open();
        doc.write(code);
        doc.close();
      } else if (ext === 'js') {
        preview.style.display = "none";
        consoleBox.style.display = "block";
        consoleBox.innerText = "Running JavaScript...\n";
        try {
          let logs = [];
          const customLog = (...args) => logs.push(args.map(a => typeof a === 'object' ? JSON.stringify(a) : a).join(' '));
          const runFn = new Function('console', code);
          runFn({ log: customLog, error: customLog, warn: customLog });
          consoleBox.innerText = logs.length ? logs.join('\n') : "Code executed successfully (no logs).";
        } catch (err) {
          consoleBox.innerText = "Error: " + err.message;
        }
      } else if (ext === 'json') {
        preview.style.display = "none";
        consoleBox.style.display = "block";
        try {
          consoleBox.innerText = "Valid JSON Format:\n" + JSON.stringify(JSON.parse(code), null, 2);
        } catch (e) {
          consoleBox.innerText = "Invalid JSON:\n" + e.message;
        }
      } else {
        preview.style.display = "none";
        consoleBox.style.display = "block";
        consoleBox.innerText = `[${ext.toUpperCase()} Source File Output]:\n\n` + code;
      }
    }

    // Direct Save to GitHub using REST API
    async function saveToGitHub() {
      const token = document.getElementById("github-token").value.trim() || localStorage.getItem("gh_token");
      if (!token) {
        alert("कृपया ऊपर 'GitHub Token' डालें। (बिना Personal Access Token के GitHub किसी को फाइल बदलने की अनुमति नहीं देता)");
        return;
      }

      const saveBtn = document.getElementById("save-btn");
      saveBtn.innerText = "⏳ Saving...";
      saveBtn.disabled = true;

      try {
        // Step 1: Get latest file SHA
        const fileInfo = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${activeFile.name}`, {
          headers: { Authorization: `Bearer ${token}` }
        }).then(r => r.json());

        // Step 2: Push commit
        const updatedContent = document.getElementById("editor-input").value;
        const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${activeFile.name}`, {
          method: "PUT",
          headers: {
            Authorization: `Bearer ${token}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: `Update ${activeFile.name} via Web Studio`,
            content: btoa(unescape(encodeURIComponent(updatedContent))),
            sha: fileInfo.sha
          })
        });

        if (res.ok) {
          alert("Success! फ़ाइल सीधे GitHub पर सेव हो गई है।");
        } else {
          const err = await res.json();
          alert("Save Failed: " + (err.message || "Token Permissions check करें"));
        }
      } catch (err) {
        alert("Error saving: " + err.message);
      } finally {
        saveBtn.innerText = "💾 Save to GitHub";
        saveBtn.disabled = false;
      }
    }

    function closeEditor() {
      document.getElementById("editor-modal").style.display = "none";
      document.getElementById("editor-preview").src = "about:blank";
      document.getElementById("console-out").innerText = "";
    }
  </script>
</body>
  </html>
