<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <meta name="theme-color" content="#090d16" />
  <title>View Gallery • 3D Mobile Photo App</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
          }
        }
      }
    };
  </script>

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      overscroll-behavior-y: contain;
      user-select: none;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* 3D Tactile Icon Container */
    .btn-3d {
      position: relative;
      background: linear-gradient(145deg, #ffffff, #e2e8f0);
      box-shadow:
        0 5px 12px -2px rgba(15, 23, 42, 0.14),
        0 3px 0 #cbd5e1,
        inset 0 2px 2px rgba(255, 255, 255, 0.9);
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.15s ease;
    }

    .dark .btn-3d {
      background: linear-gradient(145deg, #263147, #151c2c);
      box-shadow:
        0 6px 14px -2px rgba(0, 0, 0, 0.55),
        0 3px 0 #0b0f19,
        inset 0 1.5px 1.5px rgba(255, 255, 255, 0.16);
    }

    .btn-3d:active {
      transform: translateY(3px) scale(0.96);
      box-shadow:
        0 2px 5px -1px rgba(0, 0, 0, 0.3),
        0 0px 0 transparent,
        inset 0 1px 2px rgba(255, 255, 255, 0.2);
    }

    /* 3D Colored Accent Orbs */
    .orb-3d-indigo {
      background: radial-gradient(circle at 30% 25%, #a5b4fc 0%, #6366f1 45%, #4338ca 85%, #312e81 100%);
      box-shadow:
        0 6px 16px -2px rgba(99, 102, 241, 0.5),
        0 3px 0 #312e81,
        inset 0 2px 4px rgba(255, 255, 255, 0.65);
    }

    .orb-3d-rose {
      background: radial-gradient(circle at 30% 25%, #fda4af 0%, #f43f5e 45%, #be123c 85%, #881337 100%);
      box-shadow:
        0 6px 16px -2px rgba(244, 63, 94, 0.5),
        0 3px 0 #881337,
        inset 0 2px 4px rgba(255, 255, 255, 0.65);
    }

    .orb-3d-emerald {
      background: radial-gradient(circle at 30% 25%, #6ee7b7 0%, #10b981 45%, #047857 85%, #064e3b 100%);
      box-shadow:
        0 6px 14px -2px rgba(16, 185, 129, 0.45),
        0 3px 0 #064e3b,
        inset 0 2px 4px rgba(255, 255, 255, 0.65);
    }

    .orb-3d-amber {
      background: radial-gradient(circle at 30% 25%, #fde68a 0%, #f59e0b 45%, #b45309 85%, #78350f 100%);
      box-shadow:
        0 6px 14px -2px rgba(245, 158, 11, 0.45),
        0 3px 0 #78350f,
        inset 0 2px 4px rgba(255, 255, 255, 0.7);
    }

    /* Drop shadow for 3D SVG Graphics */
    .svg-3d-shadow {
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.32));
    }

    /* Shimmer placeholder */
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    .skeleton-shimmer {
      background: linear-gradient(90deg, rgba(148, 163, 184, 0.1) 25%, rgba(148, 163, 184, 0.24) 50%, rgba(148, 163, 184, 0.1) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.6s infinite linear;
    }

    /* Smooth Gallery Card */
    .gallery-item {
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.22s ease;
    }
    .gallery-item:active {
      transform: scale(0.97);
    }

    #lightbox-img {
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
      touch-action: none;
    }

    .pb-dock {
      padding-bottom: calc(6.5rem + env(safe-area-inset-bottom, 0px));
    }
  </style>
</head>

<body class="bg-slate-100 text-slate-900 dark:bg-[#090d16] dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-200">

  <svg width="0" height="0" class="absolute pointer-events-none">
    <defs>
      <linearGradient id="grad3d-blue" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#93c5fd" />
        <stop offset="50%" stop-color="#3b82f6" />
        <stop offset="100%" stop-color="#1d4ed8" />
      </linearGradient>
      <linearGradient id="grad3d-purple" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#e9d5ff" />
        <stop offset="45%" stop-color="#a855f7" />
        <stop offset="100%" stop-color="#6b21a8" />
      </linearGradient>
      <linearGradient id="grad3d-pink" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fecdd3" />
        <stop offset="45%" stop-color="#f43f5e" />
        <stop offset="100%" stop-color="#9f1239" />
      </linearGradient>
      <linearGradient id="grad3d-gold" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fef08a" />
        <stop offset="50%" stop-color="#f59e0b" />
        <stop offset="100%" stop-color="#b45309" />
      </linearGradient>
      <linearGradient id="grad3d-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#a7f3d0" />
        <stop offset="50%" stop-color="#10b981" />
        <stop offset="100%" stop-color="#065f46" />
      </linearGradient>
      <linearGradient id="grad3d-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#a5f3fc" />
        <stop offset="50%" stop-color="#06b6d4" />
        <stop offset="100%" stop-color="#155e75" />
      </linearGradient>
    </defs>
  </svg>

  <header class="sticky top-0 z-30 bg-white/80 dark:bg-[#0f1624]/80 backdrop-blur-2xl border-b border-slate-200/70 dark:border-slate-800/80">
    <div class="max-w-5xl mx-auto px-4 py-3">
      <div class="flex items-center justify-between gap-3">
        
        <!-- Left: 3D Gallery Emblem & Title -->
        <div class="flex items-center gap-3 min-w-0">
          <div class="w-11 h-11 rounded-2xl orb-3d-indigo flex items-center justify-center shrink-0">
            <!-- 3D Layered Gallery Icon -->
            <svg class="w-6 h-6 svg-3d-shadow" viewBox="0 0 32 32" fill="none">
              <rect x="6" y="3" width="20" height="18" rx="4" fill="url(#grad3d-purple)" opacity="0.7" />
              <rect x="3" y="7" width="26" height="21" rx="5" fill="url(#grad3d-blue)" />
              <circle cx="11" cy="14" r="3" fill="url(#grad3d-gold)" />
              <path d="M5 25L12.5 17.5C13.3 16.7 14.6 16.7 15.4 17.5L20 22L23.2 18.8C24 18 25.2 18 26 18.8L29 22V23C29 25.8 26.8 28 24 28H8C5.8 28 4.4 26.2 5 25Z" fill="url(#grad3d-emerald)" />
              <rect x="3" y="7" width="26" height="21" rx="5" stroke="white" stroke-opacity="0.35" stroke-width="1" />
            </svg>
          </div>
          <div class="min-w-0">
            <div class="flex items-center gap-2">
              <h1 class="font-display font-extrabold text-lg sm:text-xl tracking-tight text-slate-900 dark:text-white truncate">
                Photos
              </h1>
              <span id="live-count-badge" class="px-2.5 py-0.5 text-[11px] font-bold rounded-full bg-indigo-500/15 text-indigo-600 dark:text-indigo-400 border border-indigo-500/25">
                0
              </span>
            </div>
            <p class="text-[11px] font-medium text-slate-500 dark:text-slate-400 truncate">
              Direct Gallery • <span class="text-indigo-500">lalankumar99/View-</span>
            </p>
          </div>
        </div>

        <!-- Right: 3D Tactile Action Buttons -->
        <div class="flex items-center gap-2 shrink-0">
          <!-- 3D Search Toggle Button -->
          <button
            onclick="toggleSearchBar()"
            title="Search Photos"
            class="btn-3d w-10 h-10 rounded-2xl flex items-center justify-center"
          >
            <svg class="w-5 h-5 svg-3d-shadow" viewBox="0 0 24 24" fill="none">
              <circle cx="10.5" cy="10.5" r="6.5" stroke="url(#grad3d-cyan)" stroke-width="3" />
              <path d="M15.5 15.5L20.5 20.5" stroke="url(#grad3d-blue)" stroke-width="3.2" stroke-linecap="round" />
              <circle cx="8.5" cy="8.5" r="1.5" fill="white" opacity="0.8" />
            </svg>
          </button>

          <!-- 3D Image Fit Toggle (Full vs Square Crop) -->
          <button
            onclick="toggleImageFit()"
            title="Toggle Full Photo vs Square Crop"
            class="btn-3d w-10 h-10 rounded-2xl flex items-center justify-center"
          >
            <svg id="fit-icon-svg" class="w-5 h-5 svg-3d-shadow" viewBox="0 0 24 24" fill="none">
              <rect x="3" y="3" width="18" height="18" rx="4" fill="url(#grad3d-purple)" />
              <path d="M7 10V7H10M17 10V7H14M7 14V17H10M17 14V17H14" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>

          <!-- 3D Sync / Reload Button -->
          <button
            id="sync-btn"
            onclick="fetchRepositoryPhotos(true)"
            title="Refresh Gallery"
            class="btn-3d w-10 h-10 rounded-2xl flex items-center justify-center"
          >
            <svg id="sync-icon" class="w-5 h-5 svg-3d-shadow transition-transform duration-500" viewBox="0 0 24 24" fill="none">
              <path d="M20 11A8.1 8.1 0 0 0 4.5 9M4 5V9H8" stroke="url(#grad3d-emerald)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M4 13A8.1 8.1 0 0 0 19.5 15M20 19V15H16" stroke="url(#grad3d-cyan)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>

          <!-- 3D Theme Toggle Button -->
          <button
            onclick="toggleTheme()"
            title="Switch Dark / Light Theme"
            class="btn-3d w-10 h-10 rounded-2xl flex items-center justify-center"
          >
            <svg id="theme-icon-svg" class="w-5 h-5 svg-3d-shadow" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="5.5" fill="url(#grad3d-gold)" />
              <path d="M12 2V4M12 20V22M4.93 4.93L6.34 6.34M17.66 17.66L19.07 19.07M2 12H4M20 12H22M4.93 19.07L6.34 17.66M17.66 6.34L19.07 4.93" stroke="url(#grad3d-gold)" stroke-width="2.4" stroke-linecap="round" />
            </svg>
          </button>
        </div>

      </div>

      <div id="search-drawer" class="hidden pt-3 transition-all">
        <div class="flex items-center gap-2">
          <div class="relative flex-1">
            <input
              id="search-input"
              type="text"
              oninput="handleSearch(this.value)"
              placeholder="Search photo by name..."
              class="w-full pl-4 pr-9 py-2.5 rounded-2xl bg-slate-200/70 dark:bg-slate-800/90 border border-slate-300/60 dark:border-slate-700 focus:border-indigo-500 text-xs sm:text-sm outline-none transition"
            />
            <button
              id="clear-search-btn"
              onclick="clearSearch()"
              class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 w-6 h-6 rounded-full bg-slate-400/30 hover:bg-slate-400/50 text-xs items-center justify-center"
            >
              ✕
            </button>
          </div>

          <select
            id="sort-select"
            onchange="handleSortChange(this.value)"
            aria-label="Sort photos"
            class="py-2.5 px-3 rounded-2xl bg-slate-200/70 dark:bg-slate-800/90 border border-slate-300/60 dark:border-slate-700 text-xs font-semibold outline-none cursor-pointer"
          >
            <option value="default">Default Order</option>
            <option value="name-asc">Name (A → Z)</option>
            <option value="name-desc">Name (Z → A)</option>
            <option value="size-desc">Size (Largest)</option>
            <option value="size-asc">Size (Smallest)</option>
          </select>
        </div>
      </div>

    </div>
  </header>

  <main class="flex-1 max-w-5xl w-full mx-auto px-3.5 sm:px-5 pt-4 pb-dock">

    <!-- Skeleton Loading Grid -->
    <div id="loading-state" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3.5"></div>

    <!-- Empty State -->
    <div id="empty-state" class="hidden my-14 text-center px-6 py-12 rounded-3xl bg-white dark:bg-[#121929] border border-slate-200/80 dark:border-slate-800/80 shadow-sm">
      <div class="w-16 h-16 mx-auto rounded-3xl orb-3d-indigo flex items-center justify-center mb-4">
        <svg class="w-8 h-8 svg-3d-shadow" viewBox="0 0 24 24" fill="none">
          <rect x="3" y="4" width="18" height="16" rx="4" fill="url(#grad3d-blue)" />
          <circle cx="8.5" cy="9.5" r="2" fill="url(#grad3d-gold)" />
          <path d="M4 18L9 13L13 17L16.5 13.5L20 18H4Z" fill="url(#grad3d-emerald)" />
        </svg>
      </div>
      <h2 id="empty-state-title" class="font-display font-bold text-base sm:text-lg">No Photos Found</h2>
      <p id="empty-state-desc" class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-1 max-w-sm mx-auto">
        No matching photos found in this view.
      </p>
      <button onclick="resetAllFilters()" class="mt-5 px-5 py-2.5 rounded-2xl orb-3d-indigo text-white text-xs font-bold tracking-wide">
        Show All Photos
      </button>
    </div>

    <!-- Photo Gallery Container (Switches seamlessly between Grid and List) -->
    <div id="gallery-container" class="hidden"></div>

  </main>

  <div
    id="lightbox-modal"
    class="fixed inset-0 z-50 hidden bg-black/95 backdrop-blur-2xl flex-col justify-between select-none"
    role="dialog"
    aria-modal="true"
  >
    <!-- Lightbox Header -->
    <div class="px-4 py-3.5 flex items-center justify-between gap-3 bg-gradient-to-b from-black/80 to-transparent z-20">
      <div class="flex items-center gap-3 min-w-0">
        <button
          onclick="closeLightbox()"
          class="btn-3d w-10 h-10 rounded-2xl flex items-center justify-center shrink-0"
          title="Back to Gallery"
        >
          <svg class="w-5 h-5 svg-3d-shadow" viewBox="0 0 24 24" fill="none">
            <path d="M15 19L8 12L15 5" stroke="url(#grad3d-blue)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
        <div class="min-w-0">
          <h3 id="lightbox-title" class="text-white font-display font-bold text-sm sm:text-base truncate">Photo Name</h3>
          <p id="lightbox-subtitle" class="text-slate-400 text-[11px] truncate">1 of 10 • JPG</p>
        </div>
      </div>

      <!-- Top Right 3D Controls -->
      <div class="flex items-center gap-2 shrink-0">
        <!-- 3D Rotate Button -->
        <button
          onclick="rotateLightboxImage()"
          class="btn-3d w-10 h-10 rounded-2xl flex items-center justify-center"
          title="Rotate Photo"
        >
          <svg class="w-5 h-5 svg-3d-shadow" viewBox="0 0 24 24" fill="none">
            <path d="M20 11A8.1 8.1 0 0 0 4.5 9M4 5V9H8" stroke="url(#grad3d-gold)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M4 13A8.1 8.1 0 0 0 19.5 15" stroke="url(#grad3d-purple)" stroke-width="2.8" stroke-linecap="round" />
          </svg>
        </button>

        <!-- 3D Zoom Button -->
        <button
          onclick="toggleZoomLightbox()"
          class="btn-3d w-10 h-10 rounded-2xl flex items-center justify-center"
          title="Zoom In / Out"
        >
          <svg class="w-5 h-5 svg-3d-shadow" viewBox="0 0 24 24" fill="none">
            <circle cx="11" cy="11" r="6.5" stroke="url(#grad3d-cyan)" stroke-width="2.8" />
            <path d="M11 8.5V13.5M8.5 11H13.5" stroke="white" stroke-width="2.2" stroke-linecap="round" />
            <path d="M16 16L20.5 20.5" stroke="url(#grad3d-blue)" stroke-width="3" stroke-linecap="round" />
          </svg>
        </button>

        <!-- 3D Favorite Heart Button -->
        <button
          onclick="toggleCurrentLightboxFavorite()"
          class="btn-3d w-10 h-10 rounded-2xl flex items-center justify-center"
          title="Favorite"
        >
          <svg id="lightbox-fav-svg" class="w-5 h-5 svg-3d-shadow" viewBox="0 0 24 24" fill="none">
            <path d="M12 20.5C12 20.5 3.5 15 3.5 8.8C3.5 5.8 5.8 3.5 8.7 3.5C10.4 3.5 11.9 4.3 12 5.5C12.1 4.3 13.6 3.5 15.3 3.5C18.2 3.5 20.5 5.8 20.5 8.8C20.5 15 12 20.5 12 20.5Z" fill="url(#grad3d-pink)" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Lightbox Stage -->
    <div id="lightbox-stage" class="relative flex-1 flex items-center justify-center overflow-hidden px-2">
      <button
        onclick="navigateLightbox(-1)"
        class="btn-3d absolute left-3 sm:left-5 z-20 w-11 h-11 rounded-2xl flex items-center justify-center"
        title="Previous Photo"
      >
        <svg class="w-5 h-5 svg-3d-shadow" viewBox="0 0 24 24" fill="none">
          <path d="M15 18L9 12L15 6" stroke="url(#grad3d-blue)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>

      <img
        id="lightbox-img"
        src=""
        alt=""
        class="max-h-[75vh] max-w-full object-contain rounded-xl shadow-2xl select-none"
        draggable="false"
      />

      <button
        onclick="navigateLightbox(1)"
        class="btn-3d absolute right-3 sm:right-5 z-20 w-11 h-11 rounded-2xl flex items-center justify-center"
        title="Next Photo"
      >
        <svg class="w-5 h-5 svg-3d-shadow" viewBox="0 0 24 24" fill="none">
          <path d="M9 18L15 12L9 6" stroke="url(#grad3d-blue)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
    </div>

    <!-- Lightbox Bottom Bar -->
    <div class="px-4 pt-2 pb-6 bg-gradient-to-t from-black/95 via-black/75 to-transparent z-20">
      <div class="max-w-md mx-auto flex items-center justify-between gap-2.5">
        <button
          onclick="downloadCurrentPhoto()"
          class="flex-1 py-3 px-4 rounded-2xl orb-3d-indigo text-white font-display font-bold text-xs sm:text-sm flex items-center justify-center gap-2 active:translate-y-0.5 transition"
        >
          <svg class="w-4 h-4 svg-3d-shadow" viewBox="0 0 24 24" fill="none">
            <path d="M12 4V16M12 16L7 11M12 16L17 11" stroke="white" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M4 20H20" stroke="white" stroke-width="2.6" stroke-linecap="round" />
          </svg>
          <span>Download Photo</span>
        </button>

        <button
          onclick="copyCurrentPhotoLink()"
          class="btn-3d py-3 px-4 rounded-2xl font-display font-bold text-xs sm:text-sm text-slate-800 dark:text-white flex items-center justify-center gap-2"
        >
          <svg class="w-4 h-4 svg-3d-shadow" viewBox="0 0 24 24" fill="none">
            <path d="M10 13A5 5 0 0 0 17.54 14.54L20.54 11.54A5 5 0 0 0 13.46 4.46L11.75 6.18" stroke="url(#grad3d-cyan)" stroke-width="2.6" stroke-linecap="round" />
            <path d="M14 11A5 5 0 0 0 6.46 9.46L3.46 12.46A5 5 0 0 0 10.54 19.54L12.24 17.82" stroke="url(#grad3d-purple)" stroke-width="2.6" stroke-linecap="round" />
          </svg>
          <span>Copy Link</span>
        </button>
      </div>
    </div>
  </div>

  <nav class="fixed bottom-4 inset-x-0 z-30 px-4 pointer-events-none">
    <div class="max-w-xs mx-auto p-1.5 rounded-3xl bg-white/90 dark:bg-[#131b2e]/90 backdrop-blur-2xl border border-slate-200/80 dark:border-slate-700/70 shadow-2xl grid grid-cols-3 gap-1.5 pointer-events-auto">
      
      <!-- Tab 1: 3D Grid Gallery -->
      <button
        id="nav-grid"
        onclick="switchView('grid')"
        class="flex items-center justify-center gap-2 py-2.5 px-3 rounded-2xl font-display font-bold text-xs transition"
      >
        <svg class="w-5 h-5 svg-3d-shadow shrink-0" viewBox="0 0 24 24" fill="none">
          <rect x="3" y="3" width="7.5" height="7.5" rx="2.5" fill="url(#grad3d-blue)" />
          <rect x="13.5" y="3" width="7.5" height="7.5" rx="2.5" fill="url(#grad3d-purple)" />
          <rect x="3" y="13.5" width="7.5" height="7.5" rx="2.5" fill="url(#grad3d-cyan)" />
          <rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2.5" fill="url(#grad3d-emerald)" />
        </svg>
        <span>Gallery</span>
      </button>

      <!-- Tab 2: 3D Clean List View -->
      <button
        id="nav-list"
        onclick="switchView('list')"
        class="flex items-center justify-center gap-2 py-2.5 px-3 rounded-2xl font-display font-bold text-xs transition"
      >
        <svg class="w-5 h-5 svg-3d-shadow shrink-0" viewBox="0 0 24 24" fill="none">
          <rect x="3" y="4" width="5" height="4.5" rx="1.5" fill="url(#grad3d-gold)" />
          <rect x="10" y="5" width="11" height="2.5" rx="1.2" fill="url(#grad3d-blue)" />
          <rect x="3" y="9.75" width="5" height="4.5" rx="1.5" fill="url(#grad3d-pink)" />
          <rect x="10" y="10.75" width="11" height="2.5" rx="1.2" fill="url(#grad3d-purple)" />
          <rect x="3" y="15.5" width="5" height="4.5" rx="1.5" fill="url(#grad3d-emerald)" />
          <rect x="10" y="16.5" width="11" height="2.5" rx="1.2" fill="url(#grad3d-cyan)" />
        </svg>
        <span>List</span>
      </button>

      <!-- Tab 3: 3D Favorites -->
      <button
        id="nav-fav"
        onclick="switchView('fav')"
        class="relative flex items-center justify-center gap-1.5 py-2.5 px-3 rounded-2xl font-display font-bold text-xs transition"
      >
        <svg class="w-5 h-5 svg-3d-shadow shrink-0" viewBox="0 0 24 24" fill="none">
          <path d="M12 20.5C12 20.5 3.5 15 3.5 8.8C3.5 5.8 5.8 3.5 8.7 3.5C10.4 3.5 11.9 4.3 12 5.5C12.1 4.3 13.6 3.5 15.3 3.5C18.2 3.5 20.5 5.8 20.5 8.8C20.5 15 12 20.5 12 20.5Z" fill="url(#grad3d-pink)" />
          <circle cx="8" cy="7.5" r="1.2" fill="white" opacity="0.7" />
        </svg>
        <span>Saved</span>
        <span id="nav-fav-badge" class="hidden ml-0.5 px-1.5 py-0.2 rounded-full bg-rose-500 text-white text-[10px] font-extrabold">0</span>
      </button>

    </div>
  </nav>

  <!-- Toast Notification -->
  <div
    id="toast"
    class="fixed bottom-20 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 translate-y-3 transition-all duration-300 px-4 py-2.5 rounded-2xl bg-slate-900/95 dark:bg-white/95 text-white dark:text-slate-900 text-xs font-bold shadow-2xl flex items-center gap-2"
  >
    <span class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
    <span id="toast-msg">Updated</span>
  </div>

  <script>
    // Target GitHub Repository
    const REPO_OWNER = 'lalankumar99';
    const REPO_NAME = 'View-';
    const DEFAULT_BRANCH = 'main';

    // Strict Photo-Only Filter (ignores .md, .html, .js, .json, etc.)
    const IMAGE_EXTENSIONS_REGEX = /\.(jpe?g|png|webp|gif|svg|bmp|avif|ico|tiff?)$/i;

    // App State
    let allPhotos = [];
    let filteredPhotos = [];
    let currentView = 'grid';      // 'grid' | 'list' | 'fav'
    let searchQuery = '';
    let sortMode = 'default';
    let fitEntirePhoto = false;    // false = clean gallery square crop, true = full uncropped fit
    let favorites = new Set();

    // Lightbox State
    let currentLightboxIndex = 0;
    let currentZoom = 1;
    let currentRotation = 0;

    try {
      const savedFavs = JSON.parse(localStorage.getItem('view_gallery_favs') || '[]');
      if (Array.isArray(savedFavs)) favorites = new Set(savedFavs);
    } catch (e) {
      favorites = new Set();
    }

    function formatCleanPhotoName(filename) {
      let decoded = filename;
      try {
        decoded = decodeURIComponent(filename);
      } catch (e) {}
      const withoutExt = decoded.replace(/\.[^/.]+$/, '');
      const cleaned = withoutExt.replace(/[_]+/g, ' ').trim();
      return cleaned || decoded;
    }

    function getFileExtension(filename) {
      const match = filename.match(/\.([a-zA-Z0-9]+)$/);
      return match ? match[1].toUpperCase() : 'IMG';
    }

    function formatBytes(bytes) {
      if (!bytes || isNaN(bytes) || bytes <= 0) return '';
      if (bytes < 1024) return bytes + ' B';
      const kb = bytes / 1024;
      if (kb < 1024) return kb.toFixed(1) + ' KB';
      return (kb / 1024).toFixed(2) + ' MB';
    }

    function renderLoadingSkeletons() {
      const container = document.getElementById('loading-state');
      let html = '';
      for (let i = 0; i < 6; i++) {
        html += `
          <div class="rounded-3xl overflow-hidden bg-white dark:bg-[#121929] border border-slate-200/70 dark:border-slate-800/80 shadow-sm">
            <div class="aspect-square w-full skeleton-shimmer"></div>
            <div class="p-3 space-y-2">
              <div class="h-3.5 w-2/3 rounded-md skeleton-shimmer"></div>
            </div>
          </div>
        `;
      }
      container.innerHTML = html;
    }

    async function fetchRepositoryPhotos(isManualRefresh = false) {
      const loadingEl = document.getElementById('loading-state');
      const galleryEl = document.getElementById('gallery-container');
      const emptyEl = document.getElementById('empty-state');
      const syncIcon = document.getElementById('sync-icon');

      if (isManualRefresh) {
        syncIcon.classList.add('animate-spin');
        showToast('Syncing photos from GitHub...');
      }

      renderLoadingSkeletons();
      loadingEl.classList.remove('hidden');
      galleryEl.classList.add('hidden');
      emptyEl.classList.add('hidden');

      let rawFiles = [];

      try {
        // Strategy 1: GitHub Git Trees Recursive API
        const treeUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/git/trees/${DEFAULT_BRANCH}?recursive=1`;
        const treeRes = await fetch(treeUrl, { headers: { 'Accept': 'application/vnd.github.v3+json' } });

        if (treeRes.ok) {
          const treeData = await treeRes.json();
          if (treeData && Array.isArray(treeData.tree)) {
            rawFiles = treeData.tree
              .filter(item => item.type === 'blob')
              .map(item => ({
                path: item.path,
                name: item.path.split('/').pop(),
                size: item.size || 0
              }));
          }
        } else {
          throw new Error('Tree API non-200');
        }
      } catch (treeErr) {
        try {
          // Strategy 2: GitHub Contents API
          rawFiles = await fetchViaContentsApi('');
        } catch (contentsErr) {
          try {
            // Strategy 3: jsDelivr Package API (No rate limits)
            const jsdUrl = `https://data.jsdelivr.com/v1/package/gh/${REPO_OWNER}/${REPO_NAME}@${DEFAULT_BRANCH}/flat`;
            const jsdRes = await fetch(jsdUrl);
            if (jsdRes.ok) {
              const jsdData = await jsdRes.json();
              if (jsdData && Array.isArray(jsdData.files)) {
                rawFiles = jsdData.files.map(f => {
                  const cleanPath = f.name.replace(/^\//, '');
                  return {
                    path: cleanPath,
                    name: cleanPath.split('/').pop(),
                    size: f.size || 0
                  };
                });
              }
            }
          } catch (jsdErr) {
            console.error('Failed to load repository files:', jsdErr);
          }
        }
      }

      // Filter strictly direct photo files
      const photoList = [];
      rawFiles.forEach((file, idx) => {
        if (IMAGE_EXTENSIONS_REGEX.test(file.name) && !file.name.startsWith('.')) {
          const encodedPath = file.path.split('/').map(encodeURIComponent).join('/');
          const rawUrl = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${DEFAULT_BRANCH}/${encodedPath}`;
          const cdnUrl = `https://cdn.jsdelivr.net/gh/${REPO_OWNER}/${REPO_NAME}@${DEFAULT_BRANCH}/${encodedPath}`;

          photoList.push({
            id: file.path,
            index: idx,
            path: file.path,
            filename: file.name,
            cleanName: formatCleanPhotoName(file.name),
            ext: getFileExtension(file.name),
            size: file.size || 0,
            formattedSize: formatBytes(file.size || 0),
            url: rawUrl,
            fallbackUrl: cdnUrl
          });
        }
      });

      allPhotos = photoList;
      updateBadges();
      updateDockStyles();
      applyFiltersAndRender();

      loadingEl.classList.add('hidden');
      syncIcon.classList.remove('animate-spin');

      if (isManualRefresh) {
        showToast(`Loaded ${allPhotos.length} photos`);
      }
    }

    async function fetchViaContentsApi(dirPath = '') {
      const encodedDir = dirPath ? '/' + dirPath.split('/').map(encodeURIComponent).join('/') : '';
      const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents${encodedDir}?ref=${DEFAULT_BRANCH}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('Contents API error');
      const items = await res.json();
      let collected = [];

      for (const item of items) {
        if (item.type === 'file') {
          collected.push({ path: item.path, name: item.name, size: item.size || 0 });
        } else if (item.type === 'dir') {
          try {
            const sub = await fetchViaContentsApi(item.path);
            collected = collected.concat(sub);
          } catch (e) {}
        }
      }
      return collected;
    }

    function updateBadges() {
      document.getElementById('live-count-badge').textContent = allPhotos.length;
      const favBadge = document.getElementById('nav-fav-badge');
      if (favorites.size > 0) {
        favBadge.textContent = favorites.size;
        favBadge.classList.remove('hidden');
      } else {
        favBadge.classList.add('hidden');
      }
    }

    function applyFiltersAndRender() {
      const galleryEl = document.getElementById('gallery-container');
      const emptyEl = document.getElementById('empty-state');

      let list = allPhotos.slice();

      if (currentView === 'fav') {
        list = list.filter(p => favorites.has(p.id));
      }

      if (searchQuery.trim() !== '') {
        const q = searchQuery.toLowerCase().trim();
        list = list.filter(
          p => p.cleanName.toLowerCase().includes(q) || p.filename.toLowerCase().includes(q)
        );
      }

      if (sortMode === 'name-asc') {
        list.sort((a, b) => a.cleanName.localeCompare(b.cleanName, undefined, { numeric: true }));
      } else if (sortMode === 'name-desc') {
        list.sort((a, b) => b.cleanName.localeCompare(a.cleanName, undefined, { numeric: true }));
      } else if (sortMode === 'size-desc') {
        list.sort((a, b) => (b.size || 0) - (a.size || 0));
      } else if (sortMode === 'size-asc') {
        list.sort((a, b) => (a.size || 0) - (b.size || 0));
      } else {
        list.sort((a, b) => a.index - b.index);
      }

      filteredPhotos = list;

      if (filteredPhotos.length === 0) {
        galleryEl.classList.add('hidden');
        emptyEl.classList.remove('hidden');
        const titleEl = document.getElementById('empty-state-title');
        const descEl = document.getElementById('empty-state-desc');
        if (currentView === 'fav') {
          titleEl.textContent = 'No Saved Photos Yet';
          descEl.textContent = 'Tap the 3D heart icon on any photo to save it here.';
        } else {
          titleEl.textContent = 'No Matching Photos';
          descEl.textContent = 'Try searching for a different photo name.';
        }
        return;
      }

      emptyEl.classList.add('hidden');
      galleryEl.classList.remove('hidden');

      if (currentView === 'list') {
        renderCleanListView(galleryEl);
      } else {
        renderCleanGridView(galleryEl);
      }
    }

    function renderCleanGridView(container) {
      container.className = 'grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3.5 sm:gap-4';
      const imgFitClass = fitEntirePhoto
        ? 'object-contain bg-slate-200/60 dark:bg-slate-900/90 p-1.5'
        : 'object-cover';

      container.innerHTML = filteredPhotos.map((photo, idx) => {
        const isFav = favorites.has(photo.id);
        return `
          <article
            onclick="openLightbox(${idx})"
            class="gallery-item group relative rounded-3xl overflow-hidden bg-white dark:bg-[#121929] border border-slate-200/80 dark:border-slate-800/90 shadow-sm hover:shadow-xl cursor-pointer flex flex-col"
          >
            <!-- Photo Thumbnail -->
            <div class="relative w-full aspect-square overflow-hidden skeleton-shimmer">
              <img
                src="${photo.url}"
                data-fallback="${photo.fallbackUrl}"
                alt="${escapeHtml(photo.cleanName)}"
                loading="lazy"
                onload="this.parentElement.classList.remove('skeleton-shimmer')"
                onerror="handleImageError(this)"
                class="w-full h-full ${imgFitClass} transition-transform duration-300 group-hover:scale-105"
              />

              <!-- Top-Right 3D Heart Button -->
              <button
                onclick="event.stopPropagation(); toggleFavorite('${escapeJsString(photo.id)}')"
                title="Save Photo"
                class="absolute top-2.5 right-2.5 w-8 h-8 rounded-xl ${isFav ? 'orb-3d-rose' : 'bg-black/45 backdrop-blur-md border border-white/20'} flex items-center justify-center transition active:scale-90"
              >
                <svg class="w-4 h-4 svg-3d-shadow" viewBox="0 0 24 24" fill="none">
                  <path d="M12 20.5C12 20.5 3.5 15 3.5 8.8C3.5 5.8 5.8 3.5 8.7 3.5C10.4 3.5 11.9 4.3 12 5.5C12.1 4.3 13.6 3.5 15.3 3.5C18.2 3.5 20.5 5.8 20.5 8.8C20.5 15 12 20.5 12 20.5Z" fill="${isFav ? '#ffffff' : 'url(#grad3d-pink)'}" />
                </svg>
              </button>
            </div>

            <!-- Clean Photo Name Footer -->
            <div class="px-3 py-2.5 flex items-center justify-between gap-2 bg-white dark:bg-[#121929]">
              <h2
                class="font-display font-bold text-xs sm:text-sm text-slate-800 dark:text-slate-100 truncate"
                title="${escapeHtml(photo.filename)}"
              >
                ${escapeHtml(photo.cleanName)}
              </h2>
              <span class="shrink-0 px-1.5 py-0.5 rounded-md bg-slate-100 dark:bg-slate-800 text-[10px] font-bold text-slate-500 dark:text-slate-400">
                ${photo.ext}
              </span>
            </div>
          </article>
        `;
      }).join('');
    }

    function renderCleanListView(container) {
      container.className = 'flex flex-col gap-2.5 max-w-2xl mx-auto';

      container.innerHTML = filteredPhotos.map((photo, idx) => {
        const isFav = favorites.has(photo.id);
        return `
          <div
            onclick="openLightbox(${idx})"
            class="gallery-item group p-2.5 sm:p-3 rounded-3xl bg-white dark:bg-[#121929] border border-slate-200/80 dark:border-slate-800/90 shadow-sm hover:border-indigo-500/40 flex items-center justify-between gap-3.5 cursor-pointer"
          >
            <!-- Left: Crisp Rounded Thumbnail -->
            <div class="w-16 h-16 sm:w-20 sm:h-20 rounded-2xl overflow-hidden shrink-0 skeleton-shimmer bg-slate-100 dark:bg-slate-800 relative">
              <img
                src="${photo.url}"
                data-fallback="${photo.fallbackUrl}"
                alt="${escapeHtml(photo.cleanName)}"
                loading="lazy"
                onload="this.parentElement.classList.remove('skeleton-shimmer')"
                onerror="handleImageError(this)"
                class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105"
              />
            </div>

            <!-- Center: Clean Photo Name & Metadata -->
            <div class="min-w-0 flex-1">
              <h2 class="font-display font-bold text-sm sm:text-base text-slate-900 dark:text-white truncate">
                ${escapeHtml(photo.cleanName)}
              </h2>
              <div class="flex items-center gap-2 mt-1">
                <span class="px-2 py-0.5 rounded-lg bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 text-[10px] font-extrabold tracking-wide">
                  ${photo.ext}
                </span>
                ${photo.formattedSize ? `<span class="text-xs font-medium text-slate-400">${photo.formattedSize}</span>` : ''}
              </div>
            </div>

            <!-- Right: 3D Tactile Buttons (Favorite & Download) -->
            <div class="flex items-center gap-2 shrink-0">
              <button
                onclick="event.stopPropagation(); toggleFavorite('${escapeJsString(photo.id)}')"
                title="Save Photo"
                class="${isFav ? 'orb-3d-rose' : 'btn-3d'} w-10 h-10 rounded-2xl flex items-center justify-center"
              >
                <svg class="w-4 h-4 svg-3d-shadow" viewBox="0 0 24 24" fill="none">
                  <path d="M12 20.5C12 20.5 3.5 15 3.5 8.8C3.5 5.8 5.8 3.5 8.7 3.5C10.4 3.5 11.9 4.3 12 5.5C12.1 4.3 13.6 3.5 15.3 3.5C18.2 3.5 20.5 5.8 20.5 8.8C20.5 15 12 20.5 12 20.5Z" fill="${isFav ? '#ffffff' : 'url(#grad3d-pink)'}" />
                </svg>
              </button>

              <button
                onclick="event.stopPropagation(); downloadPhotoByIndex(${idx})"
                title="Download Photo"
                class="orb-3d-emerald w-10 h-10 rounded-2xl flex items-center justify-center active:translate-y-0.5 transition"
              >
                <svg class="w-4 h-4 svg-3d-shadow" viewBox="0 0 24 24" fill="none">
                  <path d="M12 4V15M12 15L8 11M12 15L16 11" stroke="white" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
                  <path d="M5 19H19" stroke="white" stroke-width="2.6" stroke-linecap="round" />
                </svg>
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function handleImageError(imgEl) {
      const fallback = imgEl.getAttribute('data-fallback');
      if (fallback && imgEl.src !== fallback) {
        imgEl.src = fallback;
      } else {
        imgEl.parentElement.classList.remove('skeleton-shimmer');
        imgEl.src = `https://placehold.co/600x600/1e293b/e2e8f0?text=${encodeURIComponent(imgEl.alt || 'Photo')}`;
      }
    }

    function switchView(view) {
      currentView = view;
      updateDockStyles();
      applyFiltersAndRender();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function updateDockStyles() {
      const tabs = ['grid', 'list', 'fav'];
      tabs.forEach(t => {
        const btn = document.getElementById(`nav-${t}`);
        if (t === currentView) {
          btn.className = 'relative flex items-center justify-center gap-2 py-2.5 px-3 rounded-2xl orb-3d-indigo text-white font-display font-bold text-xs transition';
        } else {
          btn.className = 'relative flex items-center justify-center gap-2 py-2.5 px-3 rounded-2xl text-slate-600 dark:text-slate-300 hover:bg-slate-200/60 dark:hover:bg-slate-800/60 font-display font-bold text-xs transition';
        }
      });
    }

    function toggleSearchBar() {
      const drawer = document.getElementById('search-drawer');
      const input = document.getElementById('search-input');
      if (drawer.classList.contains('hidden')) {
        drawer.classList.remove('hidden');
        setTimeout(() => input.focus(), 50);
      } else {
        drawer.classList.add('hidden');
      }
    }

    function toggleImageFit() {
      fitEntirePhoto = !fitEntirePhoto;
      showToast(fitEntirePhoto ? 'Full Uncropped Photo Mode' : 'Square Gallery Grid Mode');
      applyFiltersAndRender();
    }

    function handleSearch(val) {
      searchQuery = val || '';
      const clearBtn = document.getElementById('clear-search-btn');
      if (searchQuery.length > 0) {
        clearBtn.classList.remove('hidden');
        clearBtn.classList.add('flex');
      } else {
        clearBtn.classList.add('hidden');
        clearBtn.classList.remove('flex');
      }
      applyFiltersAndRender();
    }

    function clearSearch() {
      const input = document.getElementById('search-input');
      input.value = '';
      handleSearch('');
    }

    function handleSortChange(val) {
      sortMode = val;
      applyFiltersAndRender();
    }

    function resetAllFilters() {
      currentView = 'grid';
      clearSearch();
      updateDockStyles();
      applyFiltersAndRender();
    }

    function toggleFavorite(photoId) {
      if (favorites.has(photoId)) {
        favorites.delete(photoId);
        showToast('Removed from Saved');
      } else {
        favorites.add(photoId);
        showToast('Saved to Favorites');
      }
      try {
        localStorage.setItem('view_gallery_favs', JSON.stringify(Array.from(favorites)));
      } catch (e) {}

      updateBadges();
      applyFiltersAndRender();
      updateLightboxFavoriteButton();
    }

    // Lightbox Functions
    function openLightbox(index) {
      if (!filteredPhotos || filteredPhotos.length === 0) return;
      currentLightboxIndex = index;
      resetLightboxTransform();

      const modal = document.getElementById('lightbox-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      document.body.style.overflow = 'hidden';

      updateLightboxContent();
    }

    function closeLightbox() {
      const modal = document.getElementById('lightbox-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      document.body.style.overflow = '';
    }

    function updateLightboxContent() {
      const photo = filteredPhotos[currentLightboxIndex];
      if (!photo) return;

      const imgEl = document.getElementById('lightbox-img');
      imgEl.src = photo.url;
      imgEl.onerror = () => {
        if (imgEl.src !== photo.fallbackUrl) imgEl.src = photo.fallbackUrl;
      };

      document.getElementById('lightbox-title').textContent = photo.cleanName;
      document.getElementById('lightbox-subtitle').textContent = `${currentLightboxIndex + 1} of ${filteredPhotos.length} • ${photo.ext}${photo.formattedSize ? ' • ' + photo.formattedSize : ''}`;
      updateLightboxFavoriteButton();
    }

    function updateLightboxFavoriteButton() {
      const photo = filteredPhotos[currentLightboxIndex];
      if (!photo) return;
      const svgEl = document.getElementById('lightbox-fav-svg');
      const isFav = favorites.has(photo.id);
      svgEl.innerHTML = `<path d="M12 20.5C12 20.5 3.5 15 3.5 8.8C3.5 5.8 5.8 3.5 8.7 3.5C10.4 3.5 11.9 4.3 12 5.5C12.1 4.3 13.6 3.5 15.3 3.5C18.2 3.5 20.5 5.8 20.5 8.8C20.5 15 12 20.5 12 20.5Z" fill="${isFav ? 'url(#grad3d-pink)' : '#94a3b8'}" />`;
    }

    function toggleCurrentLightboxFavorite() {
      const photo = filteredPhotos[currentLightboxIndex];
      if (!photo) return;
      toggleFavorite(photo.id);
    }

    function navigateLightbox(direction) {
      if (!filteredPhotos || filteredPhotos.length === 0) return;
      resetLightboxTransform();
      currentLightboxIndex = (currentLightboxIndex + direction + filteredPhotos.length) % filteredPhotos.length;
      updateLightboxContent();
    }

    function resetLightboxTransform() {
      currentZoom = 1;
      currentRotation = 0;
      applyLightboxTransform();
    }

    function toggleZoomLightbox() {
      currentZoom = currentZoom === 1 ? 2.25 : 1;
      applyLightboxTransform();
    }

    function rotateLightboxImage() {
      currentRotation = (currentRotation + 90) % 360;
      applyLightboxTransform();
    }

    function applyLightboxTransform() {
      const imgEl = document.getElementById('lightbox-img');
      if (imgEl) {
        imgEl.style.transform = `scale(${currentZoom}) rotate(${currentRotation}deg)`;
      }
    }

    async function downloadPhotoByIndex(index) {
      const photo = filteredPhotos[index];
      if (!photo) return;
      showToast(`Downloading "${photo.cleanName}"...`);
      try {
        const response = await fetch(photo.url);
        const blob = await response.blob();
        const blobUrl = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = blobUrl;
        link.download = photo.filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setTimeout(() => URL.revokeObjectURL(blobUrl), 3000);
      } catch (e) {
        window.open(photo.url, '_blank');
      }
    }

    function downloadCurrentPhoto() {
      downloadPhotoByIndex(currentLightboxIndex);
    }

    function copyCurrentPhotoLink() {
      const photo = filteredPhotos[currentLightboxIndex];
      if (!photo) return;
      const tempInput = document.createElement('textarea');
      tempInput.value = photo.url;
      document.body.appendChild(tempInput);
      tempInput.select();
      try {
        document.execCommand('copy');
        showToast('Direct photo link copied!');
      } catch (err) {
        showToast('Could not copy link');
      }
      document.body.removeChild(tempInput);
    }

    function setupTouchAndKeyboardListeners() {
      const stage = document.getElementById('lightbox-stage');
      let touchStartX = 0;
      let touchStartY = 0;

      stage.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
        }
      }, { passive: true });

      stage.addEventListener('touchend', (e) => {
        if (currentZoom > 1) return;
        const dx = e.changedTouches[0].clientX - touchStartX;
        const dy = e.changedTouches[0].clientY - touchStartY;
        if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) {
          navigateLightbox(dx < 0 ? 1 : -1);
        }
      }, { passive: true });

      let lastTap = 0;
      stage.addEventListener('touchend', () => {
        const now = Date.now();
        if (now - lastTap < 280) toggleZoomLightbox();
        lastTap = now;
      });

      window.addEventListener('keydown', (e) => {
        const modal = document.getElementById('lightbox-modal');
        if (modal.classList.contains('hidden')) return;
        if (e.key === 'ArrowRight') navigateLightbox(1);
        else if (e.key === 'ArrowLeft') navigateLightbox(-1);
        else if (e.key === 'Escape') closeLightbox();
      });
    }

    function toggleTheme() {
      const htmlEl = document.documentElement;
      const iconSvg = document.getElementById('theme-icon-svg');
      if (htmlEl.classList.contains('dark')) {
        htmlEl.classList.remove('dark');
        iconSvg.innerHTML = `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" fill="url(#grad3d-purple)" />`;
        showToast('Light Mode');
      } else {
        htmlEl.classList.add('dark');
        iconSvg.innerHTML = `
          <circle cx="12" cy="12" r="5.5" fill="url(#grad3d-gold)" />
          <path d="M12 2V4M12 20V22M4.93 4.93L6.34 6.34M17.66 17.66L19.07 19.07M2 12H4M20 12H22M4.93 19.07L6.34 17.66M17.66 6.34L19.07 4.93" stroke="url(#grad3d-gold)" stroke-width="2.4" stroke-linecap="round" />
        `;
        showToast('Dark Mode');
      }
    }

    let toastTimeout = null;
    function showToast(message) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-msg').textContent = message;
      toast.classList.remove('opacity-0', 'translate-y-3');
      toast.classList.add('opacity-100', 'translate-y-0');

      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-3');
        toast.classList.remove('opacity-100', 'translate-y-0');
      }, 2200);
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function escapeJsString(str) {
      return String(str || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    }

    window.onload = function () {
      setupTouchAndKeyboardListeners();
      fetchRepositoryPhotos(false);
    };
  </script>
</body>
</html>
